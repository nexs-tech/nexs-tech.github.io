<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in – Safety Union Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sub-theme.css">
<style>
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .auth-msg{font-size:.9rem;margin-top:12px;min-height:1.2em}
  .auth-msg.error{color:var(--warn)}
  .auth-msg.success{color:var(--good)}
  .forgot{display:block;text-align:right;font-size:.88rem;margin:-8px 0 16px;color:var(--cyan);cursor:pointer}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <svg width="40" height="40" viewBox="0 0 48 48">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd8ff"/><stop offset="1" stop-color="#1f55ff"/></linearGradient></defs>
        <path d="M24 3 42 10v13c0 11-7.5 19.5-18 22C13.5 42.5 6 34 6 23V10z" fill="url(#lg)"/>
        <path d="M16 17v9a8 8 0 0 0 16 0v-9" fill="none" stroke="#02105c" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span style="font-family:var(--display);font-weight:800">SUB</span>
    </div>
    <h1 id="auth-title">Sign in</h1>
    <p class="sub" id="auth-sub">Enter your Safety Union credentials to continue.</p>

    <form id="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field" id="password-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <a class="forgot" id="forgot-link">Forgot password?</a>
      <button type="submit" class="btn full" id="submit-btn">Sign in</button>
      <p class="auth-msg error" id="auth-error"></p>
      <p class="auth-msg success" id="auth-success"></p>
    </form>

    <div class="divider">or</div>
    <button type="button" class="btn ghost full" id="toggle-btn">Create SUB account</button>
    <p class="links" id="toggle-text">New here? <a id="toggle-link" href="#">Create a SUB account</a></p>
  </div>
</div>

<script type="module">
import {
  supabase, greetingFor
} from '../js/supabase-config.js';

const form = document.getElementById('auth-form');
const email = document.getElementById('email');
const password = document.getElementById('password');
const submitBtn = document.getElementById('submit-btn');
const toggleBtn = document.getElementById('toggle-btn');
const toggleText = document.getElementById('toggle-text');
const authTitle = document.getElementById('auth-title');
const authSub = document.getElementById('auth-sub');
const authError = document.getElementById('auth-error');
const authSuccess = document.getElementById('auth-success');
const forgotLink = document.getElementById('forgot-link');
const passwordField = document.getElementById('password-field');

let isLogin = true;
let isForgot = false;

const urlParams = new URLSearchParams(window.location.search);
const redirectTo = urlParams.get('redirect') || '/pages/dashboard.html';
const plan = urlParams.get('plan');

function setMode(login) {
  isLogin = login;
  isForgot = false;
  forgotLink.style.display = login ? 'block' : 'none';
  passwordField.style.display = 'block';
  password.required = true;
  if (login) {
    authTitle.textContent = 'Sign in';
    authSub.textContent = plan === 'pro'
      ? 'Sign in to upgrade to Union Pro.'
      : 'Enter your Safety Union credentials to continue.';
    submitBtn.textContent = 'Sign in';
    toggleBtn.textContent = 'Create SUB account';
    toggleText.innerHTML = 'New here? <a id="toggle-link" href="#">Create a SUB account</a>';
  } else {
    authTitle.textContent = 'Create SUB account';
    authSub.textContent = 'Start receiving safer payments in minutes.';
    submitBtn.textContent = 'Create account';
    toggleBtn.textContent = 'Sign in';
    toggleText.innerHTML = 'Already have an account? <a id="toggle-link" href="#">Sign in</a>';
  }
  document.getElementById('toggle-link')?.addEventListener('click', e => {
    e.preventDefault();
    setMode(!isLogin);
  });
  authError.textContent = '';
  authSuccess.textContent = '';
}

forgotLink.addEventListener('click', async (e) => {
  e.preventDefault();
  const emailVal = email.value.trim();
  if (!emailVal) {
    authError.textContent = 'Please enter your email address.';
    return;
  }
  try {
    authError.textContent = '';
    authSuccess.textContent = '';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Sending…';
    const { error } = await supabase.auth.resetPasswordForEmail(emailVal, {
      redirectTo: window.location.origin + '/pages/login.html?reset=true',
    });
    if (error) throw error;
    authSuccess.textContent = 'Password reset link sent. Check your inbox.';
    forgotLink.style.display = 'none';
  } catch (err) {
    authError.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});

async function handlePasswordReset() {
  const hash = window.location.hash;
  if (hash.includes('access_token') || urlParams.get('reset') === 'true') {
    isForgot = true;
    authTitle.textContent = 'Reset password';
    authSub.textContent = 'Enter your new password.';
    submitBtn.textContent = 'Update password';
    toggleBtn.style.display = 'none';
    toggleText.style.display = 'none';
    forgotLink.style.display = 'none';
    passwordField.style.display = 'block';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.textContent = '';
  authSuccess.textContent = '';

  const emailVal = email.value.trim();
  const passwordVal = password.value;

  if (!emailVal) { authError.textContent = 'Email is required.'; return; }
  if (!isForgot && !passwordVal) { authError.textContent = 'Password is required.'; return; }

  try {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Processing…';

    if (isForgot) {
      const { error } = await supabase.auth.updateUser({ password: passwordVal });
      if (error) throw error;
      authSuccess.textContent = 'Password updated. You can now sign in.';
      setTimeout(() => {
        setMode(true);
        isForgot = false;
        toggleBtn.style.display = 'inline-flex';
        toggleText.style.display = 'block';
        forgotLink.style.display = 'block';
        submitBtn.textContent = 'Sign in';
      }, 2000);
      return;
    }

    let result;
    if (isLogin) {
      result = await supabase.auth.signInWithPassword({
        email: emailVal,
        password: passwordVal,
      });
    } else {
      const name = emailVal.split('@')[0];
      result = await supabase.auth.signUp({
        email: emailVal,
        password: passwordVal,
        options: {
          data: { full_name: name },
          emailRedirectTo: window.location.origin + '/pages/dashboard.html',
        },
      });
    }

    if (result.error) throw result.error;

    if (isLogin) {
      let target = redirectTo || '/pages/dashboard.html';
      if (plan === 'pro') {
        target += (target.includes('?') ? '&' : '?') + 'plan=pro';
      }
      window.location.href = target;
    } else {
      if (result.data?.session) {
        window.location.href = '/pages/dashboard.html';
      } else {
        authSuccess.textContent = 'Account created! Check your email to confirm, then sign in.';
        setTimeout(() => setMode(true), 2000);
      }
    }
  } catch (err) {
    authError.textContent = err.message || 'Something went wrong.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = isLogin ? 'Sign in' : 'Create account';
  }
});

toggleBtn.addEventListener('click', () => setMode(!isLogin));

if (window.location.hash.includes('access_token') || urlParams.get('reset') === 'true') {
  handlePasswordReset();
} else {
  setMode(true);
}

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && !window.location.hash.includes('access_token')) {
    let target = redirectTo || '/pages/dashboard.html';
    if (plan === 'pro') target += (target.includes('?') ? '&' : '?') + 'plan=pro';
    window.location.href = target;
  }
})();
</script>
</body>
</html>
