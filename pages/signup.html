<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open account – Safety Union Backup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sub-theme.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <svg width="40" height="40" viewBox="0 0 48 48">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd8ff"/><stop offset="1" stop-color="#1f55ff"/></linearGradient></defs>
        <path d="M24 3 42 10v13c0 11-7.5 19.5-18 22C13.5 42.5 6 34 6 23V10z" fill="url(#lg)"/>
        <path d="M16 17v9a8 8 0 0 0 16 0v-9" fill="none" stroke="#02105c" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span style="font-family:var(--display);font-weight:800">SUB</span>
    </div>
    <h1>Create your account</h1>
    <p class="sub">Start receiving safer payments in minutes</p>

    <form id="signupForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Tobi Adeyemi" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="10" maxlength="128" placeholder="At least 10 characters" autocomplete="new-password">
      </div>
      <div class="field">
        <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
          <input type="checkbox" required style="width:auto;margin-top:3px">
          <span style="color:var(--mist);font-size:.88rem">I agree to the terms and understand that every transaction includes a transparent protection &amp; maintenance fee.</span>
        </label>
      </div>
      <div id="cap" style="margin-bottom:14px"></div>
      <p id="msg" class="sub" role="alert"></p>
      <button type="submit" class="btn full" id="go">Open free account</button>
    </form>

    <p class="links">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="../js/sub-core.js"></script>

<script src="../js/pages/signup.js"></script>
</body>
</html>
